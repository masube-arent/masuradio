<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151323"><title>RADIO MASU 88.8</title><style>body{margin:0;background:#151323;color:#f5efff;font:16px system-ui,sans-serif}main{max-width:720px;margin:auto;padding:32px 18px}h1{font-size:clamp(2rem,8vw,4rem);margin-bottom:0}p{line-height:1.7;color:#c5bbd7}.card{padding:20px;border-radius:20px;background:#25213b;margin:20px 0}audio{width:100%;margin:12px 0}a{color:#bba6ff}small{color:#a89dbd}</style><main><small>AI DEV RADIO / 毎朝更新</small><h1>RADIO MASU <span style="color:#d8a2ff">88.8</span></h1><p>AI駆動開発者のための深夜ラジオ。技術は真面目、DJは不真面目。</p><div id="episodes">放送を準備中…</div><p><small>公式情報をもとにAIが構成。音声と台本は自動生成です。</small></p></main><script>fetch('./episodes/index.json?'+Date.now()).then(r=>r.json()).then(items=>{document.querySelector('#episodes').innerHTML=items.length?items.map(e=>'<section class="card"><small>'+e.date+'</small><h2>'+e.title+'</h2><audio controls preload="none" src="./'+e.audio+'"></audio><p>放送時間: '+Math.round(e.duration_seconds/60)+'分</p><a href="./episodes/'+e.date+'.json">台本・出典を見る</a></section>').join(''):'<div class="card">まだ放送がありません。初回生成をお待ちください。</div>'}).catch(()=>document.querySelector('#episodes').textContent='番組情報を読み込めませんでした。');</script></html>

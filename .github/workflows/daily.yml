name: Daily MASURADIO
on:
  # Primary at 06:10 JST, backups at 08:10 and 11:10 JST.
  # GitHub scheduled triggers are best-effort and can be delayed or dropped.
  schedule:
    - cron: '10 21 * * *'
    - cron: '10 23 * * *'
    - cron: '10 2 * * *'
  workflow_dispatch:
  # Updating this workflow can also recover a day with no scheduled run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
permissions:
  contents: write
concurrency:
  group: masuradio-daily
  cancel-in-progress: false
jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Check whether today's episode already exists
        id: existing
        run: |
          if python scripts/verify.py --episode; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Valid episode for today already exists; skipping Gemini and TTS"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Episode absent or invalid; generating today's episode"
          fi
      - name: Generate episode
        if: steps.existing.outputs.ready != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/generate.py
      - name: Validate generated episode
        run: python scripts/verify.py --episode
      - name: Commit episode
        if: steps.existing.outputs.ready != 'true'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes/
          if git diff --cached --quiet; then
            echo 'No episode changes to commit'
            exit 0
          fi
          git commit -m "radio: daily episode"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push conflict, rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo '::error::Episode could not be pushed after 3 attempts'
          exit 1

name: Daily MASURADIO
on:
  # Primary at 06:10 JST, backups at 08:10 and 11:10 JST.
  # GitHub scheduled triggers are best-effort and can be delayed or dropped.
  schedule:
    - cron: '10 21 * * *'
    - cron: '10 23 * * *'
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      broadcast_date:
        description: 'Optional YYYY-MM-DD JST date (today or preceding six days); blank means today'
        required: false
        default: ''
        type: string
      replace_existing:
        description: 'Replace the selected date’s episode from the reviewed Work script, reusing valid audio stages'
        required: false
        default: false
        type: boolean
  # Code or workflow fixes recover today's episode if the normal run failed.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'drafts/**'
      - '.github/rebuild-request.json'
permissions:
  contents: write
concurrency:
  group: masuradio-daily
  cancel-in-progress: false
jobs:
  broadcast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh latest main before installing dependencies
        run: |
          # Queued runs must install requirements from the same main as the code.
          git fetch origin main
          git checkout -B main origin/main
      - name: Resolve fixed broadcast date
        id: day
        env:
          REQUESTED_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.broadcast_date || '' }}
        run: python3 scripts/production_readiness.py --resolve-date --date "$REQUESTED_DATE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Diagnose production readiness
        id: existing
        env:
          REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
          RADIO_DATE: ${{ steps.day.outputs.today }}
        run: |
          if [ "$REPLACE_EXISTING" = "true" ]; then
            python scripts/production_readiness.py --date "$RADIO_DATE" --replace-existing
          else
            python scripts/production_readiness.py --date "$RADIO_DATE"
          fi
      - name: Restore MASURADIO stage cache
        if: steps.existing.outputs.ready != 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .radio-cache
          key: radio-stage-${{ steps.day.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radio-stage-${{ steps.day.outputs.today }}-
      - name: Generate episode
        if: steps.existing.outputs.ready != 'true'
        env:
          RADIO_DATE: ${{ steps.day.outputs.today }}
          REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        run: |
          if [ "$REPLACE_EXISTING" = "true" ]; then
            python scripts/publish_work.py --date "$RADIO_DATE" --replace-existing
          else
            python scripts/publish_work.py --date "$RADIO_DATE"
          fi
      - name: Validate generated episode
        env:
          RADIO_DATE: ${{ steps.day.outputs.today }}
        run: python scripts/verify.py --episode "$RADIO_DATE"
      - name: Save MASURADIO stage cache
        if: always() && steps.existing.outputs.ready == 'false'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .radio-cache
          key: radio-stage-${{ steps.day.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit episode
        if: steps.existing.outputs.ready != 'true'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes/
          if git diff --cached --quiet; then
            echo 'No episode changes to commit'
            exit 0
          fi
          git commit -m "radio: daily episode"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push conflict, rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo '::error::Episode could not be pushed after 3 attempts'
          exit 1

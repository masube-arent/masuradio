name: Daily MASURADIO
on:
  # Primary at 06:10 JST, backups at 08:10 and 11:10 JST.
  # GitHub scheduled triggers are best-effort and can be delayed or dropped.
  schedule:
    - cron: '10 21 * * *'
    - cron: '10 23 * * *'
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace today’s episode from the reviewed Work script, reusing valid audio stages'
        required: false
        default: false
        type: boolean
  # Code or workflow fixes recover today's episode if the normal run failed.
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scripts/**'
      - 'drafts/**'
      - '.github/rebuild-request.json'
permissions:
  contents: write
concurrency:
  group: masuradio-daily
  cancel-in-progress: false
jobs:
  broadcast:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Refresh latest episodes before checking
        run: |
          # Another queued run may already have published today's episode.
          git fetch origin main
          git checkout -B main origin/main
      - name: Cache date
        id: day
        run: echo "today=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Check whether today's episode already exists
        id: existing
        env:
          REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
          RADIO_DATE: ${{ steps.day.outputs.today }}
        run: |
          # A reviewed request is consumed only by a successfully published pair.
          # The latest-main refresh and concurrency group prevent duplicate runs.
          REQUEST_PENDING=$(python scripts/rebuild_request.py --date "$RADIO_DATE")
          if [ "$REPLACE_EXISTING" = "true" ] || [ "$REQUEST_PENDING" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Explicit replacement requested; keep published files until new audio passes validation"
          elif python scripts/verify.py --episode "$RADIO_DATE"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Valid episode for today already exists; skipping Gemini and TTS"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Episode absent or invalid; generating today's episode"
          fi
      - name: Validate today's reviewed Work script
        if: steps.existing.outputs.ready != 'true'
        env:
          RADIO_DATE: ${{ steps.day.outputs.today }}
        run: |
          if [ ! -f "drafts/$RADIO_DATE/script.json" ] || [ ! -f "drafts/$RADIO_DATE/review.json" ]; then
            echo "::error::Today's reviewed Work script has not arrived. Existing broadcasts stay published. No paid fallback is run."
            exit 1
          fi
          python scripts/work_script.py --date "$RADIO_DATE"
      - name: Restore MASURADIO stage cache
        if: steps.existing.outputs.ready != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .radio-cache
          key: radio-stage-${{ steps.day.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radio-stage-${{ steps.day.outputs.today }}-
      - name: Generate episode
        if: steps.existing.outputs.ready != 'true'
        env:
          RADIO_DATE: ${{ steps.day.outputs.today }}
          REPLACE_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_existing }}
        run: |
          if [ "$REPLACE_EXISTING" = "true" ]; then
            python scripts/publish_work.py --date "$RADIO_DATE" --replace-existing
          else
            python scripts/publish_work.py --date "$RADIO_DATE"
          fi
      - name: Validate generated episode
        env:
          RADIO_DATE: ${{ steps.day.outputs.today }}
        run: python scripts/verify.py --episode "$RADIO_DATE"
      - name: Save MASURADIO stage cache
        if: always() && steps.existing.outputs.ready == 'false'
        uses: actions/cache/save@v4
        with:
          path: .radio-cache
          key: radio-stage-${{ steps.day.outputs.today }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit episode
        if: steps.existing.outputs.ready != 'true'
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes/
          if git diff --cached --quiet; then
            echo 'No episode changes to commit'
            exit 0
          fi
          git commit -m "radio: daily episode"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            echo "Push conflict, rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo '::error::Episode could not be pushed after 3 attempts'
          exit 1

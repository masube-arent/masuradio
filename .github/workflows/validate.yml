name: Validate MASURADIO
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'site/**'
      - 'requirements.txt'
      - '.github/workflows/**'
      - 'drafts/**'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: masuradio-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg for real audio integration tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate reviewed Work submissions without API calls
        run: python scripts/work_script.py --all
      - name: Run playback tests
        run: node tests/test_playback.cjs
      - name: Check playback state syntax
        run: node --check site/playback_state.js
      - name: Check player JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/index.html','utf8');
          const matches = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if(matches.length !== 1) throw new Error('Expected one player script');
          new Function(matches[0][1]);
          console.log('Player JavaScript parsed correctly');
          NODE

name: Publish MASURADIO
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Daily MASURADIO]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: python scripts/build_index.py
      - name: Validate archive before publishing
        run: python scripts/verify.py --archive
      - run: mkdir -p public && cp site/index.html public/index.html && cp -r episodes public/episodes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
